<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Scanner de pointage</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
    #log { font-size: 11px; color: #888; text-align: left; max-width: 400px; margin: 15px auto; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>Scanner de pointage</h2>
  <div id="reader" style="width:100%; max-width:400px; margin:0 auto;"></div>
  <div id="log"></div>

  <script>
   const APPS_SCRIPT_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbyh3V9O3MZqaERXUClLoZD_mMTLfVXN1I5NHpFfmQQRcp_cYDsmYjylQ6rIunyHMsgL/exec";
const DEVICE_KEY = "farh123";

let dejaTraite = false;

const scanner = new Html5QrcodeScanner("reader", { fps: 10, facingMode: "environment" });

function onScanSuccess(idEmploye) {
  if (dejaTraite) return;
  dejaTraite = true;

  scanner.clear(); // Arrete immediatement la camera

  const url = `${APPS_SCRIPT_URL}?id=${encodeURIComponent(idEmploye)}&device_key=${encodeURIComponent(DEVICE_KEY)}`;
  window.location.href = url;
}

scanner.render(onScanSuccess);
    }

    }

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
    scanner.render(onScanSuccess, onScanFailure);
  </script>
</body>
</html>
