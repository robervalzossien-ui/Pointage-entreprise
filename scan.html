<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner de pointage</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { font-family: Arial; text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <h2>Scanner de pointage</h2>
  <div id="reader" style="width:100%; max-width:400px; margin:0 auto;"></div>

  <script>
    var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyh3V9O3MZqaERXUClLoZD_mMTLfVXN1I5NHpFfmQQRcp_cYDsmYjylQ6rIunyHMsgL/exec";
    var DEVICE_KEY = "farh123";
    var dejaTraite = false;

   var scanner = new Html5QrcodeScanner("reader", { fps: 10 });

    function onScanSuccess(idEmploye) {
      if (dejaTraite) { return; }
      dejaTraite = true;

      scanner.clear();

      var url = APPS_SCRIPT_URL + "?id=" + encodeURIComponent(idEmploye) + "&device_key=" + encodeURIComponent(DEVICE_KEY);
      window.location.href = url;
    }

    scanner.render(onScanSuccess);
  </script>
</body>
</html>
